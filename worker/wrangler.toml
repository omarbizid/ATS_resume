name = "cv-studio-ai"
main = "src/index.js"
compatibility_date = "2025-09-01"
# Served at https://cv-studio-ai.cvstudio.workers.dev; no per-version preview URLs.
workers_dev = true
preview_urls = false

[vars]
# Sites allowed to call this server (comma-separated).
# Local ports: 5173 is `npm run dev`, 4173 is `npm run preview` (the production build).
ALLOWED_ORIGINS = "https://omarbizid.github.io,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173"
# First entry is the default model.
ALLOWED_MODELS = "gemini-2.5-flash,gemini-2.5-flash-lite"

# 10 requests per minute per visitor IP.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# The Gemini key is a secret, never stored in this file:
#   npx wrangler secret put GEMINI_API_KEY
